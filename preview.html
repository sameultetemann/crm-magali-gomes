ut id="epBanheiros" type="number" min="0" value="${esc(p.banheiros||'')}"></div><div class="form-field"><label>Suítes</label><input id="epSuites" type="number" min="0" value="${esc(p.suites||'')}"></div><div class="form-field"><label>Vagas de garagem</label><input id="epVagas" type="number" min="0" value="${esc(p.vagas||'')}"></div></div><div class="section-title">Proprietário</div><div class="form-grid"><div class="form-field"><label>Nome do proprietário</label><input id="epProprietario" value="${esc(p.proprietario||'')}"></div><div class="form-field"><label>E-mail do proprietário</label><input id="epPropEmail" type="email" value="${esc(p.proprietarioEmail||'')}"></div><div class="form-field"><label>Telefone do proprietário</label><input id="epPropTelefone" value="${esc(p.proprietarioTelefone||'')}"></div><div class="form-field"><label>Data de aniversário</label><input id="epPropAniversario" type="date" value="${esc(p.proprietarioAniversario||'')}"></div><div class="form-field full"><label>Observações</label><textarea id="epObs">${esc(p.observacoes||'')}</textarea></div></div><div class="form-actions"><button class="btn-light" onclick="openProperty('${esc(p.id)}')">Cancelar</button><button class="btn-primary" onclick="saveEditProperty('${esc(p.id)}')">Salvar alterações</button></div></div>`;document.getElementById('clientModal').classList.add('open')}
async function saveEditProperty(id){const p=PROPERTY_DATA.find(x=>String(x.id)===String(id));if(!p)return;const input=document.getElementById('epFotos');const novas=input&&input.files?await filesToDataUrls(input.files):[];p.nome=document.getElementById('epNome').value.trim();p.tipo=document.getElementById('epTipo').value;p.localizacao=document.getElementById('epLocal').value.trim();p.codigo=document.getElementById('epCodigo').value.trim();p.valor=document.getElementById('epValor').value.trim();p.condominio=document.getElementById('epCondominio').value.trim();p.areaTotal=document.getElementById('epAreaTotal').value.trim();p.areaConstruida=document.getElementById('epAreaConstruida').value.trim();p.quartos=document.getElementById('epQuartos').value.trim();p.banheiros=document.getElementById('epBanheiros').value.trim();p.suites=document.getElementById('epSuites').value.trim();p.vagas=document.getElementById('epVagas').value.trim();p.proprietario=document.getElementById('epProprietario').value.trim();p.proprietarioEmail=document.getElementById('epPropEmail').value.trim();p.proprietarioTelefone=document.getElementById('epPropTelefone').value.trim();p.proprietarioAniversario=document.getElementById('epPropAniversario').value;p.observacoes=document.getElementById('epObs').value.trim();if(novas.length)p.fotos=[...(p.fotos||[]),...novas];persistProperties();openProperty(id);refresh()}
function persistData(){try{localStorage.setItem('magali_crm_clients_v2',JSON.stringify(DATA))}catch(e){}}
function persistProperties(){try{localStorage.setItem('magali_crm_properties_v2',JSON.stringify(PROPERTY_DATA))}catch(e){}}
function loadPersistent(){try{const c=JSON.parse(localStorage.getItem('magali_crm_clients_v2')||'null');if(Array.isArray(c))DATA.splice(0,DATA.length,...c);const p=JSON.parse(localStorage.getItem('magali_crm_properties_v2')||'null');if(Array.isArray(p))PROPERTY_DATA.splice(0,PROPERTY_DATA.length,...p)}catch(e){}}
function negotiationsView(){return `<div class="card panel"><div class="head"><div><h2>Negociações</h2><small>Negociações cadastradas separadamente dos clientes.</small></div></div><div class="empty" style="padding:70px 20px"><strong>Nenhuma negociação cadastrada.</strong><br><span>Não vou transformar os status dos clientes em negociações sem que isso esteja registrado.</span></div></div>`}
function agendaView(){return `<div class="card panel"><div class="head"><div><h2>Agenda</h2><small>Compromissos e tarefas cadastrados.</small></div></div><div class="empty" style="padding:70px 20px"><strong>Nenhum compromisso ou evento cadastrado.</strong><br><span>As datas de contato dos clientes permanecem no histórico, mas não serão transformadas em compromissos de agenda.</span></div></div>`}
function reportsView(){const f=filtered(),orig=['Instagram','OLX','Indicação','Placa','Site','Outro'].map(o=>[o,f.filter(l=>(l.origem||'Outro')===o).length]);return `<div class="section-grid"><div class="card panel"><div class="head"><h2>Resumo da base</h2><button class="btn-secondary" onclick="printReport()">🖨 Imprimir relatório</button></div>${[['Total',f.length],['Novos',countStatus('novo')],['Em contato',countStatus('contato')],['Visitas',countStatus('visita')],['Propostas',countStatus('proposta')],['Fechados',countStatus('fechado')],['Perdidos',countStatus('perdido')]].map(x=>`<div class="item"><div class="item-main"><b>${x[0]}</b></div><strong>${x[1]}</strong></div>`).join('')}</div><div class="card panel"><div class="head"><h2>Origem dos leads</h2></div>${orig.map(x=>`<div class="item"><div class="item-main"><b>${x[0]}</b><small>${Math.round(x[1]/Math.max(1,f.length)*100)}% da base</small></div><strong>${x[1]}</strong></div>`).join('')}</div></div>`}
function toggleClientSelection(id){id=String(id);state.selectedClients=state.selectedClients.includes(id)?state.selectedClients.filter(x=>x!==id):[...state.selectedClients,id];refresh()}function selectAllVisible(){const ids=filtered().map(l=>String(l.id));const all=ids.length&&ids.every(id=>state.selectedClients.includes(id));state.selectedClients=all?state.selectedClients.filter(id=>!ids.includes(id)):Array.from(new Set([...state.selectedClients,...ids]));refresh()}function printSelectedClients(){const clients=DATA.filter(l=>state.selectedClients.includes(String(l.id)));if(!clients.length){alert('Selecione pelo menos um cliente para imprimir.');return}printClients(clients,'Clientes selecionados')}function printReport(){const f=filtered();const rows=f.map(l=>`<tr><td>${esc(String(l.nome||'').toUpperCase())}</td><td>${esc(l.contato||'—')}</td><td>${esc(l.email||'')}</td><td>${esc(l.imovel||'—')}</td><td>${esc(l.origem||'Outro')}</td><td>${esc(statuses.find(s=>s[0]===l.status)?.[1]||l.status||'—')}</td></tr>`).join('');openPrintWindow('Relatório de clientes',`<h1>Relatório de clientes</h1><p>Registros conforme os filtros atuais do CRM: ${f.length} cliente(s).</p><table><thead><tr><th>Cliente</th><th>Telefone</th><th>E-mail</th><th>Imóvel / interesse</th><th>Origem</th><th>Etapa</th></tr></thead><tbody>${rows}</tbody></table>`)}function printClients(clients,title){const rows=clients.map(l=>`<tr><td>${esc(String(l.nome||'').toUpperCase())}</td><td>${esc(l.contato||'—')}</td><td>${esc(l.email||'')}</td><td>${esc(l.imovel||'—')}</td><td>${esc(l.origem||'Outro')}</td><td>${esc(l.temperatura||'—')}</td><td>${esc(statuses.find(s=>s[0]===l.status)?.[1]||l.status||'—')}</td></tr>`).join('');openPrintWindow(title,`<h1>${esc(title)}</h1><p>${clients.length} cliente(s) selecionado(s).</p><table><thead><tr><th>Cliente</th><th>Telefone</th><th>E-mail</th><th>Imóvel / interesse</th><th>Origem</th><th>Temperatura</th><th>Etapa</th></tr></thead><tbody>${rows}</tbody></table>`)}function openPrintWindow(title,body){const old=document.getElementById('crm-print-frame');if(old)old.remove();const frame=document.createElement('iframe');frame.id='crm-print-frame';frame.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';document.body.appendChild(frame);const doc=frame.contentWindow.document;doc.open();doc.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4 landscape;margin:14mm}body{font-family:Arial,sans-serif;color:#222;padding:20px}h1{font-size:24px;margin:0 0 8px}p{color:#666}table{width:100%;border-collapse:collapse;margin-top:18px;font-size:11px}th,td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}th{background:#f3efe8}tr:nth-child(even){background:#fafafa}.print-head{margin-bottom:16px}@media print{body{padding:0}}</style></head><body><div class="print-head">${body}</div></body></html>`);doc.close();setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),1000)},150)}function dashboardGoClients(){state.clientStatusFilter='';state.clientNoReturnFilter=false;go('clientes');refresh()}function dashboardGoStatus(status){state.clientStatusFilter=status;state.clientNoReturnFilter=false;go('clientes');refresh()}function dashboardGoNoReturn(){state.clientStatusFilter='';state.clientNoReturnFilter=true;go('clientes');refresh()}function dashboardGoProperties(){go('imoveis')}function dashboardGoNegotiations(){go('negociacoes')}function setClientDateFilter(days){state.clientDateFilter=days||'';state.clientStatusFilter='';state.clientNoReturnFilter=false;state.search='';state.temp='todas';state.origins=[];state.tags=[];state.clientInterests=[];refresh()}function clearClientDashboardFilter(){state.clientStatusFilter='';state.clientNoReturnFilter=false;state.clientDateFilter='';refresh()}function refresh(){document.getElementById('dashboard').innerHTML=dashboard();document.getElementById('clientes').innerHTML=clientsView();document.getElementById('imoveis').innerHTML=propertiesView();document.getElementById('negociacoes').innerHTML=negotiationsView();document.getElementById('agenda').innerHTML=agendaView();document.getElementById('relatorios').innerHTML=reportsView()}function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));window.scrollTo(0,0)}function setDashboardTemp(t){state.dashboardTemp=t;refresh()}function setTemp(t){state.temp=t;refresh()}function toggleOrigin(o){state.origins=state.origins.includes(o)?state.origins.filter(x=>x!==o):[...state.origins,o];refresh()}function togglePropertyOrigin(o){state.propertyOrigins=state.propertyOrigins.includes(o)?state.propertyOrigins.filter(x=>x!==o):[...state.propertyOrigins,o];refresh()}function toggleClientInterest(i){state.clientInterests=state.clientInterests.includes(i)?state.clientInterests.filter(x=>x!==i):[...state.clientInterests,i];refresh()}function clearClientInterestFilters(){state.clientInterests=[];refresh()}function toggleTag(t){state.tags=state.tags.includes(t)?state.tags.filter(x=>x!==t):[...state.tags,t];refresh()}function clearFilters(){state.search='';state.temp='todas';state.origins=[];state.tags=[];state.clientInterests=[];state.clientStatusFilter='';state.clientNoReturnFilter=false;state.clientDateFilter='';refresh()}function clearPropertyFilters(){state.propertySearch='';state.propertyOrigins=[];refresh()}loadPersistent();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeClient()});refresh();
</script></body></html>
